<title>CODE·A.I. specialists: social card</title>

<!--
================================================================================
  THE CODE·A.I. SHARE CARD. Rendered to a PNG, never linked or indexed.

  ⛔ /code-ai USED TO BORROW THE HOME PAGE'S CARD, which is a picture of Chatty
  saying he is free. Shared anywhere, it sold the wrong product: someone who
  clicked expecting a free robot landed on a page about paid specialists, and
  someone who would have paid for a specialist never saw one.

  THE READER IS SCROLLING AND WE ARE SELLING. Cicero named being wearied by
  listening as a cause of hostility, and it is the ordinary state of a feed. A
  frontal "forty AI experts" reads as one more demand and gets scrolled, so the
  card leads on a LIMIT instead: each one knows a single trade. A claim about
  what a thing will not do is the one claim an exhausted reader has no defence
  against, and it leaves the reader to supply the argument themselves - that the
  one which answers everything keeps getting it wrong.

  FOUR THINGS, AND NOTHING ELSE:
     the chip  ·  the two-line contrast  ·  six faces with their trades  ·  the offer

  The faces carry the concreteness. "Specialist" is an abstraction at thumbnail
  size; ACCOUNTANT, CHEF and TEACHER are not, and six of them shoulder to
  shoulder is the only thing on the card that says "forty" without arguing it.

  ⛔ NO PRICE ON THE CARD. The trial is the offer. A price and a trial in the
  same second reads as the trial that quietly starts billing, which is the exact
  confusion the /code-ai page had to be fixed for once already.

  Rebuild with  tools\build-og.ps1 -Page og-codeai.html -Version vN
================================================================================
-->

<style>
:root {
  --paper:  #f7e7c3;
  --ink:    #1c1a17;
  --teal:   #0f9b9f;
  --tomato: #e03127;
  --gold:   #ffc93c;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.5 "Futura", "Century Gothic", "Trebuchet MS", Verdana, sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* Same halftone as the site, so the card is recognisably the same printing. */
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image: radial-gradient(var(--ink) 0.8px, transparent 0.9px);
  background-size: 5px 5px;
  opacity: .05;
  pointer-events: none;
}

.card {
  position: relative; height: 100%;
  padding: 4vh 4%;
  /* ⛔ CENTRED AS A GROUP, NOT PINNED TOP AND BOTTOM. Pushing the offer down
     with margin-top:auto opened a band of empty paper across the middle, which
     at thumbnail size is a third of the card spent on nothing. */
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  text-align: center;
}

/* ---- the chip ---------------------------------------------------------- */
.eyebrow {
  display: inline-block; margin: 0 0 2.4vh;
  background: var(--ink); color: var(--paper);
  font-size: 2.7vh; font-weight: 700;
  letter-spacing: .34em; text-transform: uppercase;
  /* The right padding absorbs the trailing letter-space, or the chip looks
     lopsided against text that is spaced this far apart. */
  padding: .5vh 1.1em .5vh calc(1.1em + .34em);
}

/* ---- the contrast, in two lines ---------------------------------------- */
/* ⛔ TWO LINES, NOT ONE SENTENCE. The whole device is the turn between them:
   the first line is the scale, the second is the limit, and a reader who takes
   in only the first still gets a true and complete claim. Set as one wrapped
   paragraph the turn lands wherever the line happens to break. */
h1 {
  margin: 0;
  font-size: 9.4vh; line-height: .98;
  font-weight: 900; letter-spacing: -.015em;
  text-transform: uppercase;
  text-shadow: 3px 3px 0 var(--gold);
}
h1 em {
  display: block;
  margin-top: .9vh;
  font-size: .58em; font-style: normal; font-weight: 800;
  letter-spacing: -.005em;
  color: var(--tomato);
  text-shadow: 2px 2px 0 rgba(28,26,23,.14);
}

/* ---- the faces --------------------------------------------------------- */
.trades {
  display: flex; gap: 2.4%; justify-content: center; align-items: flex-start;
  margin: 4.4vh 0 0;
}
.trade { width: 15.4%; }
/* ⛔ THESE PORTRAITS ARE NEAR-BLACK. They are lit for a dark app panel, and on
   cream paper at this size they render as featureless discs - the faces are
   there, they just have nowhere to go. Lifted for print, and framed, because a
   dark portrait has no edge of its own against a light page. Same treatment as
   the carousel on the home page, so the two read as one product. */
.trade img {
  width: 100%; aspect-ratio: 1;
  object-fit: cover; object-position: 50% 32%;
  display: block; border-radius: 50%;
  border: 4px solid var(--ink);
  background: var(--ink);
  filter: brightness(1.85) contrast(1.06) saturate(1.12);
}
.trade b {
  display: block; margin-top: 1.1vh;
  font-size: 1.85vh; font-weight: 800;
  letter-spacing: .1em; text-transform: uppercase;
}

/* ---- the offer --------------------------------------------------------- */
.offer {
  margin: 5vh 0 0;
  font-size: 3.3vh; font-weight: 700; line-height: 1.32;
}
.offer b { border-bottom: .5vh solid var(--gold); }
.offer span {
  display: block; margin-top: 1.1vh;
  font-size: .62em; font-weight: 700; letter-spacing: .12em;
  text-transform: uppercase; opacity: .55;
}
</style>

<div class="card">

  <p class="eyebrow">Inside the free app</p>

  <h1>Forty specialists<em>Each knows a single trade</em></h1>

  <div class="trades">
    <div class="trade"><img src="assets/agents/accountant.jpg" alt=""><b>Accountant</b></div>
    <div class="trade"><img src="assets/agents/writer.jpg"     alt=""><b>Writer</b></div>
    <div class="trade"><img src="assets/agents/chef.jpg"       alt=""><b>Chef</b></div>
    <div class="trade"><img src="assets/agents/teacher.jpg"    alt=""><b>Teacher</b></div>
    <div class="trade"><img src="assets/agents/builder.jpg"    alt=""><b>Builder</b></div>
    <div class="trade"><img src="assets/agents/grower.jpg"     alt=""><b>Grower</b></div>
  </div>

  <p class="offer">
    <b>All forty, free for seven days.</b> No card, nothing to cancel.
    <span>chatterbot2000.com</span>
  </p>

</div>
