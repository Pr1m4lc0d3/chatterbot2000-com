<meta charset="utf-8">
<title>Chatterbot 2000: social card</title>

<!--
================================================================================
  THE SOCIAL CARD. Rendered to a PNG, never linked or indexed.

  ⛔ NOT THE HOME PAGE SHRUNK. A share card is seen at thumbnail size in a feed,
  for about a second, next to competing noise. The home page carries six claims,
  a widget, forty specialists and a price - all of which become illegible grey
  texture at 1200x630 and cost the card the only thing it can actually land.

  FOUR THINGS, AND NOTHING ELSE:
     the title  ·  Chatty in his roundel  ·  what he says  ·  the red button

  ⛔ HE WAVES, HE DOES NOT POINT. The earlier card had him pointing right, on
  the theory that a character pointing at a button tells you to click it. He was
  not pointing AT anything - the button sits in the quadrant below his finger,
  not on it, and at thumbnail size the gesture reads as an arm sticking out.
  A wave is the greeting the speech bubble is already making, so pose and words
  say one thing instead of two.

  Rebuild with  tools\build-og.ps1  (renders this at 1200x630 and 1280x640).
================================================================================
-->

<style>
:root {
  --paper:  #f7e7c3;
  --ink:    #1c1a17;
  --teal:   #0f9b9f;
  --tomato: #e03127;
  --gold:   #ffc93c;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 16px/1.5 "Futura", "Century Gothic", "Trebuchet MS", Verdana, sans-serif;
  -webkit-font-smoothing: antialiased;
}
/* Same halftone as the site, so the card is recognisably the same printing. */
body::before {
  content: "";
  position: fixed; inset: 0;
  background-image: radial-gradient(var(--ink) 0.8px, transparent 0.9px);
  background-size: 5px 5px;
  opacity: .05;
  pointer-events: none;
}

.card { position: relative; height: 100%; padding: 3.2vh 3% 0; }

/* ---- title, across the top -------------------------------------------- */
.masthead { text-align: center; }
.eyebrow {
  display: inline-block; margin: 0 0 1.2vh;
  background: var(--ink); color: var(--paper);
  font-size: 2.7vh; font-weight: 700;
  letter-spacing: .34em; text-transform: uppercase;
  padding: .5vh 1.1em .5vh calc(1.1em + .34em);
}
h1 {
  margin: 0;
  font-size: 10.4vh; line-height: .9;
  letter-spacing: -.012em; text-transform: uppercase;
  text-shadow: 4px 4px 0 var(--gold), 6px 6px 0 var(--ink);
}
h1 em {
  /* Clear of the title's drop shadow - at 1.1vh the descenders collided with it. */
  display: block; margin-top: 2.8vh;
  font-size: .30em; font-style: italic; font-weight: 700;
  letter-spacing: .004em; text-transform: none;
  color: var(--tomato);
  text-shadow: 2px 2px 0 var(--gold), 3px 3px 0 var(--ink);
}

/* ---- Chatty, bottom left ---------------------------------------------- */
/* ⛔ SIZED BY HEIGHT, AND THE BOX IS THE ROUNDEL. This was `width: 40%` with the
   art free to be as tall as it liked, and the pose that followed was taller than
   the space: his base and the bottom of the roundel were both cut off by the
   edge of the card. A square box with a fixed height cannot do that - whatever
   fits in the circle fits on the card, and the only number to tune is his size
   inside it. */
.art {
  position: absolute; left: 2%; bottom: 4%;
  height: 66%; aspect-ratio: 1;
  display: grid; place-items: center;
}
.art::before {
  content: "";
  position: absolute;
  width: 100%; aspect-ratio: 1;
  border-radius: 50%;
  background: var(--teal);
  box-shadow: 0 0 0 6px var(--paper), 0 0 0 9px var(--ink);
}
/* ⛔ NO NUDGE HERE, AND THERE MUST NOT BE ONE. He is centred by WEIGHT in the PNG
   itself (build_wave_art.py pads the canvas), because a raised arm reaches one
   way and nothing the other. A nudge in CSS would be a second opinion about
   where his middle is, and the two would drift apart the moment the pose
   changed.

   ⛔ SIZE HIM BY WIDTH, NOT HEIGHT, EVEN THOUGH HEIGHT IS WHAT IS BEING JUDGED.
   `height: 88%; width: auto` blew the card apart: a grid item's min-width is
   auto, the percentage height is indefinite while the track is being measured,
   so the image fell back to its intrinsic 748px, dragged the track out with it,
   and aspect-ratio turned that into a roundel most of the card wide. The box's
   width IS definite (its height times aspect-ratio), so a percentage width is
   safe. Retune this if the pose is recut at a different aspect. */
.art img {
  position: relative;
  width: 81%; height: auto;
  filter: drop-shadow(0 8px 14px rgba(0,0,0,.25));
}

/* ---- what he says ------------------------------------------------------ */
.pitch {
  position: absolute;
  left: 41%; top: 26%;
  width: 42%;
  margin: 0;
  font-size: 3.05vh; line-height: 1.35;
  background: #fff;
  border: 3px solid var(--ink);
  border-radius: 16px;
  box-shadow: 5px 5px 0 var(--ink);
  padding: 1.7vh 1.5em;
}
/* The tail, pointing down-left at Chatty so the words are clearly his. */
.pitch::after {
  content: "";
  position: absolute; left: 8%; bottom: -2.4vh;
  border: 1.3vh solid transparent;
  border-top-color: var(--ink);
  border-bottom: 0;
}

/* ---- the ask, filling the bottom-right quadrant ------------------------ */
/* The button owns the bottom-right quadrant outright. It no longer leans on a
   gesture to say it is the thing to click - it is the only red object on cream
   paper, at the end of the reading path, which is a stronger signal than a
   finger was.

   ⛔ SIZED FOR A THUMBNAIL, NOT FOR THIS FILE. Seen in a Discord or Slack
   unfurl the card is rendered around half this wide, and the previous button's
   sub-line was simply unreadable there. If it does not survive being halved it
   is too small, whatever it looks like at full size. */
.ask {
  position: absolute;
  left: 50%; top: 50%;
  width: 50%; height: 50%;
  display: grid; place-items: center;
}
.btn {
  display: inline-block;
  background: var(--tomato); color: #fff;
  font-size: 6.2vh; font-weight: 800;
  letter-spacing: .03em; text-transform: uppercase;
  text-decoration: none;
  padding: .52em .78em;
  border: 5px solid var(--ink);
  box-shadow: 10px 10px 0 var(--ink);
  text-align: center;
  white-space: nowrap;
}
/* ⛔ THE PLATFORM BELONGS ON THE BUTTON. Without it the card asks a Mac user to
   click something that will not run, and leaves a Windows user unsure it is for
   them - the single most pertinent fact about a download, and it was missing. */
.btn em {
  display: block; margin-top: .2vh;
  font-size: .62em; font-style: normal; font-weight: 800;
  letter-spacing: .04em;
}
.btn small {
  display: block; margin-top: 1vh;
  font-size: .34em; letter-spacing: .1em; font-weight: 700;
}
/* Sits under the button, on the paper - a roadmap note, not part of the ask. */
.plat {
  position: absolute;
  left: 50%; bottom: 4.5%;
  transform: translateX(-50%);
  margin: 0;
  font-size: 2.3vh; font-weight: 700;
  letter-spacing: .16em; text-transform: uppercase;
  opacity: .55; white-space: nowrap;
}
</style>

<div class="card">

  <div class="masthead">
    <p class="eyebrow">Introducing</p>
    <h1>Chatterbot&nbsp;2000<em>the friendly little robot you can trust</em></h1>
  </div>

  <div class="art">
    <img src="assets/chatty-waving.png" width="748" height="820" alt="">
  </div>

  <p class="pitch">“Hi! I’m Chatty. I sit on your desktop and do things for you.
    No browser tab, no sign-up, and nothing to pay me, ever.”</p>

  <div class="ask">
    <span class="btn">Download Free<em>for Windows</em><small>Free forever · No account</small></span>
    <p class="plat">macOS &amp; Android coming soon</p>
  </div>

</div>
